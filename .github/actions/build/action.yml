name: Build Sidekick
description: Build, test and package Sidekick with the official Dalamud references.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.404'
    - name: Download official Dalamud reference assemblies
      shell: pwsh
      run: |
        $referencePath = Join-Path $env:GITHUB_WORKSPACE '.tools/dalamud'
        New-Item -ItemType Directory -Force -Path .tools | Out-Null
        Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile .tools/dalamud.zip
        Expand-Archive -LiteralPath .tools/dalamud.zip -DestinationPath $referencePath
        "DALAMUD_HOME=$referencePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Build, test and validate package
      shell: pwsh
      run: ./scripts/Build.ps1
