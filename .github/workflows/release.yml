name: Publish plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version (e.g. 0.11.0.0). Leave empty for automatic numbering.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sidekick-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JagoIsReal/sidekick' && github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: release
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $projectPath = 'src/Sidekick/Sidekick.csproj'
          [xml]$project = Get-Content -LiteralPath $projectPath -Raw
          $tags = @(git tag --list 'v*')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read existing version tags.' }
          $version = ./scripts/Get-ReleaseVersion.ps1 -ProjectVersion $project.Project.PropertyGroup.Version -ExistingTags $tags -RequestedVersion $env:REQUESTED_VERSION
          # Release metadata is generated in this checkout; no bot commits are needed.
          $project.Project.PropertyGroup.Version = $version
          $project.Save((Join-Path $env:GITHUB_WORKSPACE $projectPath))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: ./.github/actions/build
      - name: Publish release and Dalamud repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $package = "artifacts/Sidekick-$env:RELEASE_VERSION.zip"
          # All assets are uploaded to a draft before the new feed becomes public.
          gh release create $tag $package "$package.sha256" artifacts/repo.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Sidekick $env:RELEASE_VERSION" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. The previous public release is unchanged.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the prepared release.' }
          $repository = "https://github.com/$env:GITHUB_REPOSITORY"
          foreach ($url in @("$repository/releases/download/$tag/Sidekick-$env:RELEASE_VERSION.zip", "$repository/releases/download/$tag/repo.json")) {
            $available = $false
            for ($attempt = 0; $attempt -lt 3; $attempt++) {
              try { $null = Invoke-WebRequest -Uri $url -Method Head; $available = $true; break }
              catch { if ($attempt -lt 2) { Start-Sleep -Seconds 3 } }
            }
            if (-not $available) { throw "Published asset is not publicly accessible: $url" }
          }
          @"
          Published **Sidekick $env:RELEASE_VERSION**.

          Add this URL to Dalamud's custom plugin repositories:

          $repository/releases/latest/download/repo.json

          Release: $repository/releases/tag/$tag
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload package and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sidekick-release-validation
          path: artifacts/
          if-no-files-found: warn
