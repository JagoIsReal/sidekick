name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.tools/dalamud
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download official Dalamud reference assemblies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tools | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile .tools/dalamud.zip
          Expand-Archive -LiteralPath .tools/dalamud.zip -DestinationPath $env:DALAMUD_HOME
      - name: Build, test and validate package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Upload local development package and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sidekick-validation
          path: artifacts/
          if-no-files-found: warn

