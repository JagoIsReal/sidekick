name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
      - name: Upload local development package and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sidekick-validation
          path: artifacts/
          if-no-files-found: warn

